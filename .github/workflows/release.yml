name: Release

# Push a version tag (git tag -a v0.2.0 -m "notes…" && git push origin v0.2.0) and this builds the Windows
# installer and publishes it as a GitHub Release, with the tag's message as the release notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then echo "Tag $TAG but package.json says $VERSION"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # latest.yml (version, file, SHA-512) is what installed copies read to update themselves; the blockmap
        # lets them download only what changed.
        run: |
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          [ -s notes.md ] || echo "OneDraft ${TAG#v}" > notes.md
          FILES=$(ls dist/OneDraft-Setup-*.exe dist/OneDraft-Setup-*.exe.blockmap dist/latest.yml)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "OneDraft ${TAG#v}" --notes-file notes.md --verify-tag
          fi
